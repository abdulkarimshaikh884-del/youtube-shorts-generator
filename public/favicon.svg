<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4560"/>
      <stop offset="100%" style="stop-color:#ff8c3a"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>
  <!-- Full bleed circle — no border, no gap -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <!-- Lightning bolt centered, clipped to circle -->
  <g clip-path="url(#circleClip)">
    <polygon
      points="290,60 155,285 245,285 222,452 370,215 275,215"
      fill="#ffffff"
      stroke="none"
    />
  </g>
</svg>
